name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check executable
        shell: bash
        run: |
          set -euo pipefail
          exe="build/JuceAutosampler_artefacts/Release/JUCE Autosampler.exe"
          if [[ ! -f "$exe" ]]; then
            echo "Expected executable at $exe" >&2
            find build -maxdepth 5 \( -type d -o -type f \) | head -200 >&2
            exit 1
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          path: "build/JuceAutosampler_artefacts/Release/JUCE Autosampler.exe"
          if-no-files-found: error
          retention-days: 30
          archive: false
