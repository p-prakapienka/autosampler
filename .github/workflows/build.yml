name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          src="build/JuceAutosampler_artefacts/Release"
          if [[ ! -d "$src" ]]; then
            echo "Expected JUCE output at $src" >&2
            find build -maxdepth 5 \( -type d -o -type f \) | head -200 >&2
            exit 1
          fi
          mkdir -p package
          cp -a "$src"/. package/
          find package -type f \( -name '*.pdb' -o -name '*.ilk' -o -name '*.exp' \) -delete
          tar -czf autosampler-windows-x64.tar.gz -C package .
          tar -tzf autosampler-windows-x64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: autosampler-windows-x64
          path: autosampler-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
